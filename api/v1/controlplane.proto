syntax = "proto3";

package vbuckets.v1;

option go_package = "github.com/danthegoodman1/vbuckets/api/v1;apiv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ControlPlane is the service that users implement on their control plane
// server. The vbuckets proxy connects to this service to resolve virtual
// credentials and bucket mappings.
service ControlPlane {
  rpc LookupCredentials(LookupCredentialsRequest) returns (LookupCredentialsResponse);
  rpc LookupBaseHost(LookupBaseHostRequest) returns (LookupBaseHostResponse);
  rpc LookupVBucket(LookupVBucketRequest) returns (LookupVBucketResponse);
  rpc CreateVBucket(CreateVBucketRequest) returns (CreateVBucketResponse);
  rpc ListVBuckets(ListVBucketsRequest) returns (ListVBucketsResponse);

  // ListenForDeltas opens a server-streaming RPC that pushes cache updates
  // to the proxy. The control plane sends deltas whenever credentials, base
  // hosts, or vbucket mappings change, allowing the proxy to maintain
  // long-lived caches with fast invalidation.
  //
  // This pre-release form is best-effort: it has no revision, resume cursor,
  // or initial synchronization barrier and therefore does not provide a
  // no-stale-window guarantee. A revisioned synchronization contract will be
  // added before the API is considered production-ready.
  rpc ListenForDeltas(ListenForDeltasRequest) returns (stream Delta);
}

message LookupCredentialsRequest {
  string access_key_id = 1;
}

message LookupCredentialsResponse {
  string secret_key = 1;
  // Required AWS IAM JSON identity policy for this virtual access key.
  string iam_policy_json = 2;
  google.protobuf.Duration ttl = 3;
}

message LookupBaseHostRequest {
  string hostname = 1;
}

message LookupBaseHostResponse {
  string base_host = 1;
  bool found = 2;
  google.protobuf.Duration ttl = 3;
}

message LookupVBucketRequest {
  string access_key_id = 1;
  string bucket_name = 2;
}

message LookupVBucketResponse {
  string real_endpoint = 1;
  string real_bucket = 2;
  string real_access_key = 3;
  string real_secret_key = 4;
  string real_region = 5;
  // The control plane owns namespace allocation. For mappings sharing a real
  // endpoint and bucket, path_prefix values must be normalized and pairwise
  // non-overlapping; an empty prefix reserves the whole real bucket exclusively.
  string path_prefix = 6;
  bool real_use_path_style = 7;
  google.protobuf.Duration ttl = 8;
  // Required stable 32-byte random key used only to encrypt mapping-scoped
  // routing tokens. The control plane must keep it unchanged across proxy
  // replicas, restarts, and upstream credential rotation while the real
  // storage namespace is unchanged. The control plane MUST generate a new key
  // whenever real_endpoint, real_bucket, or path_prefix changes. Rotating it
  // invalidates outstanding virtual continuation, upload, and version IDs and
  // therefore requires an explicit drain window.
  bytes routing_token_key = 9;
}

message CreateVBucketRequest {
  string access_key_id = 1;
  string bucket_name = 2;
  string location_constraint = 3;
}

message CreateVBucketResponse {
  string real_endpoint = 1;
  string real_bucket = 2;
  string real_access_key = 3;
  string real_secret_key = 4;
  string real_region = 5;
  // Same namespace-allocation contract as LookupVBucketResponse.path_prefix.
  string path_prefix = 6;
  bool real_use_path_style = 7;
  google.protobuf.Duration ttl = 8;
  // Same lifetime and stability contract as LookupVBucketResponse.
  bytes routing_token_key = 9;
}

message ListVBucketsRequest {
  string access_key_id = 1;
}

message VBucketSummary {
  string bucket_name = 1;
  google.protobuf.Timestamp creation_date = 2;
}

message ListVBucketsResponse {
  repeated VBucketSummary buckets = 1;
}

message ListenForDeltasRequest {}

message Delta {
  oneof delta {
    CredentialsDelta credentials = 1;
    BaseHostDelta base_host = 2;
    VBucketDelta vbucket = 3;
  }
}

// CredentialsDelta pushes a credential cache update.
// If remove is true, the entry should be evicted. Otherwise it is an upsert.
message CredentialsDelta {
  string access_key_id = 1;
  bool remove = 2;

  // Fields below are only set on upsert (remove == false).
  string secret_key = 3;
  string iam_policy_json = 4;
  google.protobuf.Duration ttl = 5;
}

// BaseHostDelta pushes a base host cache update.
// If remove is true, the entry should be evicted. Otherwise it is an upsert.
message BaseHostDelta {
  string hostname = 1;
  bool remove = 2;

  // Fields below are only set on upsert (remove == false).
  string base_host = 3;
  bool found = 4;
  google.protobuf.Duration ttl = 5;
}

// VBucketDelta pushes a vbucket mapping cache update.
// If remove is true, the entry should be evicted. Otherwise it is an upsert.
message VBucketDelta {
  string access_key_id = 1;
  string bucket_name = 2;
  bool remove = 3;

  // Fields below are only set on upsert (remove == false).
  string real_endpoint = 4;
  string real_bucket = 5;
  string real_access_key = 6;
  string real_secret_key = 7;
  string real_region = 8;
  // Same namespace-allocation contract as LookupVBucketResponse.path_prefix.
  string path_prefix = 9;
  bool real_use_path_style = 10;
  google.protobuf.Duration ttl = 11;
  // Same lifetime and stability contract as LookupVBucketResponse.
  bytes routing_token_key = 12;
}
